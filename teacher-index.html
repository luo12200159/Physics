<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f6045">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>费曼物理教师端</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="activation.css">
  <link rel="stylesheet" href="dual-app.css">
</head>
<body class="activation-pending" data-edition="teacher">
  <div class="role-shell teacher-shell">
    <header class="role-header">
      <div class="role-brand" aria-hidden="true">φ</div>
      <div class="role-title"><strong>费曼物理教师端</strong><small>班级 · 任务 · 学情 · 审核</small></div>
      <button class="connection-pill" id="teacherConnection" type="button">本机资料可用</button>
    </header>
    <main class="role-main teacher-main">
      <section class="role-page active" data-page="classes" id="teacherClasses"></section>
      <section class="role-page" data-page="tasks" id="teacherTasks"></section>
      <section class="role-page" data-page="insights" id="teacherInsights"></section>
      <section class="role-page" data-page="bank" id="teacherBank"></section>
      <section class="role-page" data-page="me" id="teacherMe"></section>
      <section class="role-page" data-page="class-detail" id="teacherClassDetail"></section>
      <section class="role-page" data-page="variant-review" id="teacherVariantReview"></section>
    </main>
    <nav class="role-nav" aria-label="教师端主导航">
      <button class="active" data-nav="classes" data-icon="▦" type="button">班级</button>
      <button data-nav="tasks" data-icon="▣" type="button">任务</button>
      <button data-nav="insights" data-icon="⌁" type="button">学情</button>
      <button data-nav="bank" data-icon="⌕" type="button">题库</button>
      <button data-nav="me" data-icon="◎" type="button">我的</button>
    </nav>
  </div>
  <script src="activation-public-key.js"></script>
  <script src="storage-repository.js"></script>
  <script src="activation.js"></script>
  <script src="curriculum-taxonomy.js"></script>
  <script src="curriculum-bank.js"></script>
  <script src="mock-exam-bank.js"></script>
  <script src="original-practice-bank.js"></script>
  <script src="targeted-practice-bank.js"></script>
  <script src="vendor/fflate.js"></script>
  <script src="security.js"></script>
  <script src="backup-validator.js"></script>
  <script src="backup.js"></script>
  <script src="classroom-config.js"></script>
  <script src="classroom-client.js"></script>
  <script src="ai-tutor.js"></script>
  <script src="question-answer-service.js"></script>
  <script src="learning-engine.js"></script>
  <script src="physics-visuals.js"></script>
  <script src="variant-generator.js"></script>
  <script src="dual-app-data.js"></script>
  <script src="dual-app-common.js"></script>
  <script src="teacher-app.js"></script>
</body>
</html>
