name: Server integration

on:
  push:
    branches: [main, feat/teacher-student-loop-v4]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Check Docker availability
        run: docker info --format '{{.ServerVersion}}'
      - name: Install locked dependencies
        run: pnpm --dir server install --frozen-lockfile
      - name: Typecheck and unit tests
        run: |
          pnpm --dir server run typecheck
          pnpm --dir server run test:unit
      - name: PostgreSQL/Redis integration tests
        run: pnpm --dir server run test:integration
      - name: Production build
        run: pnpm --dir server run build
